name: word_mate
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: 15.1.3
  flutter_bloc: any
  json_annotation: ^4.12.0
  get_it: any
  freezed_annotation: any
  flutter_easyloading: any
  equatable: any
  dio: any
  retrofit: any
  logger: any
  pretty_dio_logger: any
  flutter_secure_storage: 9.2.4
  flutter_screenutil: 5.9.3
  animate_do: ^4.2.0
  flutter_svg: ^2.0.17
  path_provider: any
  sqflite: ^2.4.1
  path: ^1.9.0
  intl: any
  audioplayers: ^6.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  bloc_test: any
  mocktail: ^1.0.4
  build_runner: any
  json_serializable: any
  freezed: any
  retrofit_generator: any
  flutter_gen_runner: any
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#3B1FA0"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_gen:
  output: lib/gen/
  line_length: 80
  integrations:
    flutter_svg: true
